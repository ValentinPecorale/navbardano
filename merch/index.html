<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merch — Dano Ziontifik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400&family=Montserrat:wght@500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles.css" />
  <script type="importmap">
    {
      "imports": {
        "@sanity/client": "https://esm.sh/@sanity/client@6"
      }
    }
  </script>
</head>
<body>
  <nav class="navbar" aria-label="Principal">
    <div class="nav-track">
      <div class="nav-highlight" data-nav-highlight aria-hidden="true"></div>
      <ul class="nav-list">
        <li>
          <a class="nav-item" data-nav-item data-nav-key="ehhpdsr" href="/albums/ehhpdsr">EHHPDSR</a>
        </li>
        <li>
          <a class="nav-item" data-nav-item data-nav-key="istmo" href="/">ISTMO</a>
        </li>
        <li>
          <a class="nav-item" data-nav-item data-nav-key="nuevos-trapos" href="/albums/nuevos-trapos">NUEVOS TRAPOS</a>
        </li>
        <li>
          <a class="nav-item nav-item--merch" href="/merch">MERCH</a>
        </li>
      </ul>
    </div>

    <div class="nav-mobile" data-nav-mobile>
      <a class="nav-item nav-item--merch" href="/merch">MERCH</a>
      <div class="nav-burger-wrap">
        <button
          type="button"
          class="nav-burger"
          data-nav-burger
          aria-expanded="false"
          aria-controls="nav-mobile-menu"
          aria-label="Abrir menú"
        >
          <span class="nav-burger-icon" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>

        <ul class="nav-mobile-menu" data-nav-mobile-menu id="nav-mobile-menu">
          <li><a class="nav-item" data-mobile-nav-item data-nav-key="ehhpdsr" href="/albums/ehhpdsr">EHHPDSR</a></li>
          <li><a class="nav-item" data-mobile-nav-item data-nav-key="istmo" href="/">ISTMO</a></li>
          <li>
            <a class="nav-item" data-mobile-nav-item data-nav-key="nuevos-trapos" href="/albums/nuevos-trapos">NUEVOS TRAPOS</a>
          </li>
        </ul>
      </div>
    </div>

    <button
      type="button"
      class="equalizer"
      data-equalizer
      aria-pressed="false"
      aria-label="Reproducir reproductor de música"
    >
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </button>

    <audio data-equalizer-audio preload="none"></audio>
  </nav>

  <main class="merch-page">
    <div class="merch-frame">
      <div class="shop-list" data-shop-list>
        <div class="shop-divider"></div>

        <div class="shop-item" data-shop-item data-shop-key="ehhpdsr">
          <button type="button" class="shop-row" data-shop-toggle aria-expanded="false">EHHPDSR</button>
          <div class="shop-products">
            <div class="shop-products-grid" data-shop-products-grid></div>
          </div>
        </div>

        <div class="shop-divider"></div>

        <div class="shop-item" data-shop-item data-shop-key="istmo">
          <button type="button" class="shop-row" data-shop-toggle aria-expanded="false">ISTMO</button>
          <div class="shop-products">
            <div class="shop-products-grid" data-shop-products-grid></div>
          </div>
        </div>

        <div class="shop-divider"></div>

        <div class="shop-item" data-shop-item data-shop-key="nuevos-trapos">
          <button type="button" class="shop-row" data-shop-toggle aria-expanded="false">NUEVOS TRAPOS</button>
          <div class="shop-products">
            <div class="shop-products-grid" data-shop-products-grid></div>
          </div>
        </div>

        <div class="shop-divider"></div>
      </div>
    </div>

    <p class="footer-credit">DANO ZIONTIFIK © 2026</p>
  </main>

  <script src="/script.js"></script>
  <script type="module" src="/merch-products.js"></script>
  <script type="module" src="/merch-song-player.js"></script>
</body>
</html>
